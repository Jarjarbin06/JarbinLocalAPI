<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Something went wrong — {{ title }}</title>

    <link rel="stylesheet" href="/static/css/main.css">
</head>

<body>

<header>
    <h1>{{ title }}</h1>
    <p>Something went wrong</p>
</header>

<main>

    <section class="card error-card">
        <h2>Something went wrong</h2>

        <p>
            The server encountered an unexpected error while processing
            your request.
        </p>

        <p class="muted">
            Please try again in a moment.
        </p>

        <div class="error-details">
            <div class="row">
                <span>Status</span>
                <span>500 Internal Server Error</span>
            </div>

            <div class="row">
                <span>Path</span>
                <span>{{ path }}</span>
            </div>

            <div class="row">
                <span>Version</span>
                <span>{{ version }}</span>
            </div>
        </div>

        <a href="/app/" class="button">
            Return to application
        </a>
    </section>

</main>

</body>
</html>
